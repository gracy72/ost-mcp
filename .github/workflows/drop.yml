name: drop

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose windows zip to republish as base64 chunks
        required: true
        default: v0.1.1-permute

permissions:
  contents: write

jobs:
  drop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch the release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf drop
          mkdir -p drop
          gh release download "${{ github.event.inputs.tag }}" -R "${{ github.repository }}" \
            -p 'ost-mcp-x86_64-pc-windows-msvc.zip*' -D drop
          ls -l drop

      - name: Base64 chunk it
        run: |
          sha256sum drop/ost-mcp-x86_64-pc-windows-msvc.zip | cut -d' ' -f1 > drop/sha256.txt
          base64 -w 0 drop/ost-mcp-x86_64-pc-windows-msvc.zip > drop/all.b64
          split -b 4000000 -d drop/all.b64 drop/chunk-
          rm -f drop/all.b64 drop/*.zip drop/ost-mcp-x86_64-pc-windows-msvc.zip.sha256
          ls -l drop

      - name: Push to a throwaway branch
        run: |
          git config user.name 'ost-mcp drop'
          git config user.email 'noreply@example.com'
          git checkout -B binary-drop
          git add -f drop
          git commit -m "binary drop: ${{ github.event.inputs.tag }}"
          git push -f origin binary-drop